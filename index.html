function both(o) { return '<span class="ar">' + o.ar + '</span><span class="en">' + o.en + '</span>'; }
var ARROW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

var html = "";
SECTIONS.forEach(function (sec) {
  html += '<section><h2>' + both(sec) + '</h2><div class="grid">';
  sec.refs.forEach(function (n) {
    var r = REFS[n];
    html += '<button class="ref" type="button" data-n="' + n + '"><span class="n">' + n + '</span>' +
            '<span class="body"><span class="t ar">' + r.a + '</span><span class="t en">' + r.t + '</span><span class="c">' + r.s + '</span></span>' +
            '<span class="go">' + ARROW + '</span></button>';
  });
  html += '</div></section>';
});
document.getElementById("list").innerHTML = html;

var dlg = document.getElementById("dlg");
function openRef(n) {
  var r = REFS[n];
  document.getElementById("dlg-n").textContent = n;
  document.getElementById("dlg-body").innerHTML =
    '<div class="t ar ta" id="dlg-t">' + r.a + '</div><div class="t en">' + r.t + '</div>' +
    '<div class="orig ar"><b>العنوان الأصلي</b><span>' + r.t + '</span></div>' +
    '<div class="cite">' + r.c + '</div>' +
    '<div class="blk"><b>' + both({ ar: "المحتوى", en: "What it is" }) + '</b>' + both(r.what) + '</div>' +
    '<div class="blk key"><b>' + both(r.k) + '</b>' + both(r.rel) + '</div>' +
    '<a class="open" href="' + r.u + '" target="_blank" rel="noopener">' + both({ ar: "فتح المرجع", en: "Open the source" }) + ' ↗</a>';
  if (typeof dlg.showModal === "function") { dlg.showModal(); } else { dlg.setAttribute("open", ""); }
  document.getElementById("dlg-body").scrollTop = 0;
}
function closeDlg() { if (typeof dlg.close === "function") { dlg.close(); } else { dlg.removeAttribute("open"); } }
document.getElementById("list").addEventListener("click", function (e) {
  var b = e.target.closest(".ref");
  if (b) { openRef(+b.getAttribute("data-n")); }
});
document.getElementById("dlg-x").addEventListener("click", closeDlg);
dlg.addEventListener("click", function (e) { if (e.target === dlg) { closeDlg(); } });

(function () {
  var root = document.documentElement;
  function set(lang) {
    root.lang = lang;
    root.dir = lang === "ar" ? "rtl" : "ltr";
    try { localStorage.setItem("nabd-lang", lang); } catch (e) {}
  }
  var start = "ar";
  try {
    var q = new URLSearchParams(location.search).get("lang");
    var saved = localStorage.getItem("nabd-lang");
    if (q === "en" || q === "ar") { start = q; } else if (saved === "en" || saved === "ar") { start = saved; }
  } catch (e) {}
  set(start);
  document.getElementById("lang").addEventListener("click", function () { set(root.lang === "ar" ? "en" : "ar"); });
})();
</script>
